name: ai-jenkins

x-agent-environment: &agent-environment
  DB_PATH: /data/findings.db
  AGENT_WORKSPACE: /workspace
  AGENT_WORKSPACE_ROOT: /workspace
  PYTHONDONTWRITEBYTECODE: "1"

services:
  docker:
    image: docker:28-dind
    privileged: true
    command:
      - --storage-driver=overlay2
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-data:/var/lib/docker
    networks:
      jenkins:
        aliases:
          - docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cert-init:
    image: ${JENKINS_IMAGE:-ai-jenkins:2.568.1-1}
    user: root
    entrypoint:
      - /usr/bin/tini
      - --
    command:
      - bash
      - -euc
      - |
        cp "$${JAVA_HOME}/lib/security/cacerts" /cacerts/cacerts
        for cert in /certs/*.crt /certs/*.pem; do
          [ -f "$${cert}" ] || continue
          alias="custom-$$(basename "$${cert%.*}")"
          "$${JAVA_HOME}/bin/keytool" -importcert -noprompt \
            -keystore /cacerts/cacerts \
            -storepass changeit \
            -alias "$${alias}" \
            -file "$${cert}"
        done
    volumes:
      - ./jenkins/certs:/certs:ro
      - jenkins-cacerts:/cacerts
    networks:
      - jenkins
    restart: "no"

  jenkins:
    image: ${JENKINS_IMAGE:-ai-jenkins:2.568.1-1}
    depends_on:
      cert-init:
        condition: service_completed_successfully
      docker:
        condition: service_healthy
    environment:
      DOCKER_CERT_PATH: /certs/client
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: >-
        ${JENKINS_JAVA_OPTS:--Xms512m -Xmx2g -Djenkins.install.runSetupWizard=true}
        -Djavax.net.ssl.trustStore=/cacerts/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
      JENKINS_OPTS: --httpListenAddress=0.0.0.0 --httpPort=8080
      JENKINS_CALLBACK_TOKEN: ${JENKINS_CALLBACK_TOKEN:-}
      WEBHOOK_INTERNAL_URL: http://webhook:8000
      BUILD_COMMAND: ${BUILD_COMMAND:-python -m compileall -q .}
      LINT_COMMAND: ${LINT_COMMAND:-python -m pytest -q}
      TEST_COMMAND: ${TEST_COMMAND:-python -m pytest --cov --cov-report=xml}
      COVERAGE_REPORT_PATH: ${COVERAGE_REPORT_PATH:-coverage/lcov.info}
      GITLAB_CREDENTIALS_ID: ${GITLAB_CREDENTIALS_ID:-gitlab-token}
    ports:
      - "${JENKINS_HTTP_HOST:-127.0.0.1}:${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - jenkins-cacerts:/cacerts:ro
    networks:
      - jenkins
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  agent-init:
    profiles:
      - agent
    image: ${AGENT_IMAGE:-ai-agent:2.1.220-1}
    user: root
    command:
      - bash
      - -euc
      - |
        alembic upgrade head
        chown -R node:node /data /workspace
    environment:
      <<: *agent-environment
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace
    networks:
      - jenkins
    restart: "no"

  webhook:
    profiles:
      - agent
    image: ${AGENT_IMAGE:-ai-agent:2.1.220-1}
    command:
      - uvicorn
      - Src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      agent-init:
        condition: service_completed_successfully
    environment:
      <<: *agent-environment
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      JENKINS_BUILD_JOB: ${JENKINS_BUILD_JOB:-ai-review-build}
      JENKINS_CALLBACK_TOKEN: ${JENKINS_CALLBACK_TOKEN:-}
    ports:
      - "${WEBHOOK_HTTP_HOST:-127.0.0.1}:${WEBHOOK_HTTP_PORT:-8000}:8000"
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace
    networks:
      - jenkins
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    profiles:
      - agent
    image: ${AGENT_IMAGE:-ai-agent:2.1.220-1}
    command:
      - python
      - -m
      - Src.worker
    depends_on:
      agent-init:
        condition: service_completed_successfully
    environment:
      <<: *agent-environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-600}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      JENKINS_TEST_JOB: ${JENKINS_TEST_JOB:-ai-review-test}
      COVERAGE_C0_TARGET: ${COVERAGE_C0_TARGET:-80}
      COVERAGE_C1_TARGET: ${COVERAGE_C1_TARGET:-70}
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - agent-data:/data
      - agent-workspace:/workspace
      - claude-home:/home/node
    networks:
      - jenkins
    healthcheck:
      test: ["CMD", "python", "-m", "Src.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  jenkins:
    driver: bridge

volumes:
  agent-data:
  agent-workspace:
  claude-home:
  jenkins-cacerts:
  jenkins-docker-certs:
  jenkins-docker-data:
  jenkins-home:
