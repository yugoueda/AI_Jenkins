name: ai-jenkins

services:
  docker:
    image: docker:28-dind
    privileged: true
    command:
      - --storage-driver=overlay2
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-data:/var/lib/docker
    networks:
      jenkins:
        aliases:
          - docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cert-init:
    image: ${JENKINS_IMAGE:-ai-jenkins:2.568.1-1}
    user: root
    entrypoint:
      - /usr/bin/tini
      - --
    command:
      - bash
      - -euc
      - |
        cp "$${JAVA_HOME}/lib/security/cacerts" /cacerts/cacerts
        for cert in /certs/*.crt /certs/*.pem; do
          [ -f "$${cert}" ] || continue
          alias="custom-$$(basename "$${cert%.*}")"
          "$${JAVA_HOME}/bin/keytool" -importcert -noprompt \
            -keystore /cacerts/cacerts \
            -storepass changeit \
            -alias "$${alias}" \
            -file "$${cert}"
        done
    volumes:
      - ./jenkins/certs:/certs:ro
      - jenkins-cacerts:/cacerts
    networks:
      - jenkins
    restart: "no"

  jenkins:
    image: ${JENKINS_IMAGE:-ai-jenkins:2.568.1-1}
    depends_on:
      cert-init:
        condition: service_completed_successfully
      docker:
        condition: service_healthy
    environment:
      DOCKER_CERT_PATH: /certs/client
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: >-
        ${JENKINS_JAVA_OPTS:--Xms512m -Xmx2g -Djenkins.install.runSetupWizard=true}
        -Djavax.net.ssl.trustStore=/cacerts/cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
      JENKINS_OPTS: --httpListenAddress=0.0.0.0 --httpPort=8080
    ports:
      - "${JENKINS_HTTP_HOST:-127.0.0.1}:${JENKINS_HTTP_PORT:-8080}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - jenkins-cacerts:/cacerts:ro
    networks:
      - jenkins
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins-cacerts:
  jenkins-docker-certs:
  jenkins-docker-data:
  jenkins-home:
