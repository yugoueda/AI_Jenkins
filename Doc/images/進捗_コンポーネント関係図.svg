<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AI Review Jenkins 進捗・コンポーネント関係図</title>
  <desc id="desc">GitLabからWebhook、ジョブキュー、Worker、Claude Code CLI、DB、Jenkinsへ至るコンポーネントの関係と、完了、一部実装、未実装の状態を示す図</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 16px; font-weight: 700; fill: #475569; letter-spacing: 1px; }
      .label { font-size: 18px; font-weight: 700; }
      .detail { font-size: 13px; fill: #475569; }
      .edge-label { font-size: 13px; fill: #475569; }
      .done { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
      .partial { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .missing { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
      .external { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-missing { fill: none; stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-red); }
      .arrow-support { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

